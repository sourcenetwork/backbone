name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "iverc/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.98.0
  PROTOC: /opt/homebrew/bin/protoc

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust formatter
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure git auth
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"
      - name: Install Rust linter
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - run: cargo clippy --all -- -D warnings
      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- . && git clean -fd

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler libdigest-sha-perl
      - name: Configure git auth
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: backbone-unit-ubuntu-24.04
      - name: Check native scenario retry rules
        run: bash .github/scripts/test-native-scenario.sh
      - run: cargo test --workspace --exclude defra-harness
      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- . && git clean -fd

  full-stack:
    name: Full Stack
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [fmt, clippy, unit-test]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure git auth
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"
      - name: Install native stack toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Run pinned native stack
        run: bash .github/scripts/test-native-stack.sh
      - name: Retain native qualification evidence
        if: ${{ always() && env.NATIVE_STACK_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-stack-logs
          path: |
            ${{ env.NATIVE_STACK_EVIDENCE }}/*.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/command.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/retry.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/clusters/*/node*/logs/*.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/exit-code
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/tee-exit-code
            ${{ env.NATIVE_STACK_EVIDENCE }}/*-Cargo.lock
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- . && git clean -fd
