name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "iverc/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.98.0
  PROTOC: /opt/homebrew/bin/protoc

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          component: rustfmt
          build-dependencies: "false"
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          component: clippy
          private-repo-token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: backbone-clippy-ubuntu-24.04
      - run: cargo clippy --all -- -D warnings
      - name: Cleanup
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: bash .github/scripts/ci-cleanup.sh

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          private-repo-token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: backbone-unit-ubuntu-24.04
      - name: Check native image evidence guards
        run: python3 .github/scripts/test-native-image-evidence.py
      - name: Check native scenario retry rules
        run: bash .github/scripts/test-native-scenario.sh
      - run: cargo test --workspace --exclude defra-harness
      - name: Cleanup
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: bash .github/scripts/ci-cleanup.sh

  full-stack:
    name: Full Stack
    runs-on: ubuntu-24.04
    # Verify normal runtime images and build both curves of the linked Defra fixture.
    timeout-minutes: 240
    needs: [fmt, clippy, unit-test]
    permissions:
      contents: read
      packages: read
    env:
      CARGO_BUILD_JOBS: "2"
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          free-build-space: "true"
          private-repo-token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run pinned native stack
        run: bash .github/scripts/test-native-stack.sh
      - name: Retain native qualification evidence
        if: ${{ always() && env.NATIVE_STACK_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-stack-logs
          path: |
            ${{ env.NATIVE_STACK_EVIDENCE }}/*.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/image-*.json
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/command.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/retry.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/clusters/*/node*/logs/*.log
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/exit-code
            ${{ env.NATIVE_STACK_EVIDENCE }}/scenarios/*/attempt-*/tee-exit-code
            ${{ env.NATIVE_STACK_EVIDENCE }}/*-Cargo.lock
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: bash .github/scripts/ci-cleanup.sh
