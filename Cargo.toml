[package]
name = "backbone"
version = "0.1.0"
description = "Full-stack integration test infrastructure for Source Network"
edition.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "2"
members = [
    "crates/test-infra",
    "crates/defra-harness",
    "crates/orbis-harness",
    "crates/acp-light-client",
    "crates/soak",
    "crates/vera-support",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
eyre = "0.6"
tracing = "0.1"
regex = "1"
rand = "0.8"
libc = "0.2"
futures = "0.3"
hex = "0.4"
toml = "0.8"
parking_lot = "0.12"
alloy-primitives = "1.0"
commonware-codec = "=2026.10.0"
commonware-consensus = "=2026.10.0"
commonware-cryptography = "=2026.10.0"
commonware-utils = "=2026.10.0"
vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "faf4a4f094c1b4f5786bce0cbeb6567966e27999" }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "faf4a4f094c1b4f5786bce0cbeb6567966e27999" }
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "faf4a4f094c1b4f5786bce0cbeb6567966e27999" }
vera-modules = { git = "https://github.com/sourcenetwork/vera.rs", rev = "faf4a4f094c1b4f5786bce0cbeb6567966e27999" }
vera-crypto = { git = "https://github.com/sourcenetwork/vera.rs", rev = "faf4a4f094c1b4f5786bce0cbeb6567966e27999" }
# Orbis at the revision `backbone.toml` builds its binaries from.
bulletin = { git = "https://github.com/sourcenetwork/orbis-rs", rev = "7b68773ce246ab6406e496cf5d653ce4fddf612e", default-features = false }
cli-tool = { git = "https://github.com/sourcenetwork/orbis-rs", rev = "7b68773ce246ab6406e496cf5d653ce4fddf612e" }
crypto = { git = "https://github.com/sourcenetwork/orbis-rs", rev = "7b68773ce246ab6406e496cf5d653ce4fddf612e", default-features = false, features = ["bls12-381"] }
proto = { git = "https://github.com/sourcenetwork/orbis-rs", rev = "7b68773ce246ab6406e496cf5d653ce4fddf612e" }

# ── Full-stack integration tests ──────────────────────────────────────────────

[[test]]
name = "full_stack"
path = "tests/full_stack.rs"

[[test]]
name = "vera_light_client"
path = "tests/vera_light_client.rs"

[dev-dependencies]
orbis-harness = { path = "crates/orbis-harness" }
defra-harness = { path = "crates/defra-harness" }
acp-light-client = { path = "crates/acp-light-client" }
vera-support = { path = "crates/vera-support" }
vera-harness.workspace = true
cli-tool.workspace = true
vera-client.workspace = true
commonware-codec.workspace = true
test-infra = { path = "crates/test-infra" }
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
bs58 = "0.5"
eyre.workspace = true
sha2 = "0.10"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
alloy-primitives.workspace = true
alloy-sol-types = "1"

