[package]
name = "orbis-harness"
version = "0.1.0"
description = "Orbis rings on a native Vera deployment for integration tests"
edition.workspace = true
license.workspace = true

[dependencies]
test-infra = { path = "../test-infra" }
defra-harness = { path = "../defra-harness" }
vera-support = { path = "../vera-support" }
vera-client.workspace = true
vera-crypto.workspace = true
vera-domain.workspace = true
vera-modules.workspace = true
alloy-sol-types = "1"
cli-tool.workspace = true
crypto.workspace = true
proto.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
eyre.workspace = true
rand.workspace = true
hex.workspace = true

k256 = { version = "0.13", features = ["ecdsa"] }
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"

[dev-dependencies]
bulletin.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
