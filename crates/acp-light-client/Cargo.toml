[package]
name = "acp-light-client"
version = "0.1.0"
description = "Proof-validated ACP cache for DefraDB (query gate) and Orbis (signing gate)"
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true
tracing.workspace = true
hex.workspace = true
parking_lot.workspace = true
futures.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }

# Shared wire types and finality verification
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
vera-permission = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
commonware-codec.workspace = true

# Transport
tokio-tungstenite = "0.26"

[dev-dependencies]
vera-modules = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
tokio = { workspace = true, features = ["full", "test-util"] }
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-utils.workspace = true
commonware-parallel = "2026.9.0"
axum = "0.8"
vera-backend = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
commonware-glue = "2026.9.0"
commonware-runtime = "2026.9.0"
tempfile = "3"
