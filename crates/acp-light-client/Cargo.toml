[package]
name = "acp-light-client"
version = "0.1.0"
description = "Proof-validated ACP cache for DefraDB (query gate) and Orbis (signing gate)"
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true
thiserror = "2"
tracing.workspace = true
hex.workspace = true
parking_lot.workspace = true
futures.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }

# Shared wire types and finality verification
vera-domain = "0.1.2"
vera-permission = "0.1.2"
vera-modules = "0.1.2"
commonware-codec.workspace = true

# Transport
tokio-tungstenite = "0.26"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-utils.workspace = true
commonware-parallel = "=2026.10.0"
axum = "0.8"
vera-backend = { git = "https://github.com/sourcenetwork/vera.rs", rev = "a9ce2e431d6f43786f94946dfc5c8a3405a9a8f6" }
commonware-glue = "=2026.10.0"
commonware-runtime = "=2026.10.0"
tempfile = "3"
