[package]
name = "acp-light-client"
version = "0.1.0"
description = "Proof-validated ACP cache for DefraDB (query gate) and Orbis (signing gate)"
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true
tracing.workspace = true
hex.workspace = true
parking_lot.workspace = true
futures.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }

# Shared wire types and finality verification
hub-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "4ac43d3ee25c9ee519291803852b0a22c4e5e7ea" }
commonware-codec.workspace = true

# Transport
tokio-tungstenite = "0.26"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-utils.workspace = true
commonware-parallel = "2026.9.0"
jmt = { version = "0.11", features = ["mocks"] }
sha2 = "0.10"
axum = "0.8"
