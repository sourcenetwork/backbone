[package]
name = "acp-light-client"
version = "0.1.0"
description = "Proof-validated ACP cache for DefraDB (query gate) and Orbis (signing gate)"
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true
tracing.workspace = true
hex.workspace = true
parking_lot.workspace = true
futures.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }

# Shared wire types and finality verification
hub-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "361f3d830666041b8afa307f3a547b239b18788f" }
hub-permission = { git = "https://github.com/sourcenetwork/hub.rs", rev = "361f3d830666041b8afa307f3a547b239b18788f" }
commonware-codec.workspace = true

# Transport
tokio-tungstenite = "0.26"

[dev-dependencies]
hub-modules = { git = "https://github.com/sourcenetwork/hub.rs", rev = "361f3d830666041b8afa307f3a547b239b18788f" }
tokio = { workspace = true, features = ["full", "test-util"] }
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-utils.workspace = true
commonware-parallel = "2026.9.0"
axum = "0.8"
hub-backend = { git = "https://github.com/sourcenetwork/hub.rs", rev = "361f3d830666041b8afa307f3a547b239b18788f" }
commonware-glue = "2026.9.0"
commonware-runtime = "2026.9.0"
tempfile = "3"
