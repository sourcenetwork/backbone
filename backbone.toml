# Component version manifest.
#
# Single source of truth for binary dependency versions. The CI script
# test-native-stack.sh reads refs from this file. To use a different
# version, edit the full commit SHA here.

[components.defra]
prefix = "DEFRA"
repo = "https://github.com/sourcenetwork/defradb.rs"
ref = "ccb17f73862a4eefe9379beac2de99cd4df5c116"
cargo_package = "cli"

[components.orbis-node]
