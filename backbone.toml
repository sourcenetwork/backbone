repo = "https://github.com/sourcenetwork/orbis-rs"
ref = "0b39b3d175c1e3abfe20377cdbe11e501611df02"
cargo_package = "orbis-node"

[components.cli-tool]
prefix = "ORBIS_CLI"
repo = "https://github.com/sourcenetwork/orbis-rs"
ref = "0b39b3d175c1e3abfe20377cdbe11e501611df02"
cargo_package = "cli-tool"

[components.verad]
prefix = "VERAD"
repo = "https://github.com/sourcenetwork/vera.rs"
ref = "923df670cabdbb57a0a5fffbbd1f4e1adaef5529"
