repo = "https://github.com/sourcenetwork/orbis-rs"
ref = "4f149e11a86727b77a12adb68fd856216d92f165"
cargo_package = "orbis-node"

[components.cli-tool]
prefix = "ORBIS_CLI"
repo = "https://github.com/sourcenetwork/orbis-rs"
ref = "4f149e11a86727b77a12adb68fd856216d92f165"
cargo_package = "cli-tool"

[components.verad]
prefix = "VERAD"
repo = "https://github.com/sourcenetwork/vera.rs"
ref = "eab3c700c7b9e800f4df23a26efabb78f32eab9d"
